# python3 ~/video-readme-maker/vrm.py all README.spec.yml
# Numbers come from bench/results/*.json through tools/readme_data.py -> bench/results/derived/readme_data.json
project:
  name: recursive-dflash2
  emoji: "🚀"
  tagline: "How fast can speculative decoding go, and does stacking drafters help? DFlash, DFlash2, DSpine and EAGLE-3 head to head, plus tree verification"
  repo: Bobliuuu/recursive-dflash2
hero:
  title: recursive-dflash2
  subtitle: "tree verification makes the best drafter faster, with no retraining"
  chips: [DSpine, DFlash, EAGLE-3, SGLang, Qwen3-8B]
theme: {accent: "#27c8e8", accent2: "#ff6b6b", accent3: "#f2c14e", good: "#3ddc97"}
readme_out: README.md
assets_dir: assets
badges:
  - {label: license, message: MIT, color: 3776ab, link: LICENSE}
  - {label: release, message: v0.1.0, color: 3ddc97, link: "https://github.com/Bobliuuu/recursive-dflash2/releases/tag/v0.1.0"}
  - {label: "🤗 dataset", message: Bobliu/recursive-dflash2, color: f2c14e, link: "https://huggingface.co/datasets/Bobliu/recursive-dflash2"}
  - {label: engine, message: "SGLang 0.5.22", color: 27c8e8}
  - {label: GPU, message: "A100 · H100 · GB10", color: 76b900, logo: nvidia}
  - {label: models, message: "Qwen3-8B · Qwen3.8-27B", color: lightgrey}
  - {label: "DSpine + tree", message: "{{ n.tree_x }} vs autoregressive", color: 3ddc97}
nav:
  - {emoji: "🎬", label: Video, anchor: video}
  - {emoji: "📊", label: Results, anchor: results}
